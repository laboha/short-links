# Общий шаблон для реплик link-service, чтобы не повторять одно и то же 3 раза
x-link-service: &link-service
  build: ./link-service
  environment:
    DATABASE_URL: postgresql://shortener:shortener@db:5432/shortener
    BASE_URL: http://localhost
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

# Общий шаблон для реплик redirect-service
x-redirect-service: &redirect-service
  build: ./redirect-service
  environment:
    DATABASE_URL: postgresql://shortener:shortener@db:5432/shortener
    GRPC_TARGET: nginx:50051   # REST-шлюз /stats/api ходит в gRPC через балансировщик
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  # ===== Централизованная БД =====
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
      POSTGRES_DB: shortener
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # -h 127.0.0.1: проверяем по TCP. Пока postgres выполняет init.sql, он слушает
      # только локальный сокет, поэтому без -h сервисы стартовали бы раньше, чем созданы таблицы
      test: ["CMD-SHELL", "pg_isready -U shortener -d shortener -h 127.0.0.1"]
      interval: 3s
      retries: 10

  # ===== Модуль 1: три реплики link-service (REST) =====
  link-service-1:
    <<: *link-service
    hostname: link-service-1
  link-service-2:
    <<: *link-service
    hostname: link-service-2
  link-service-3:
    <<: *link-service
    hostname: link-service-3

  # ===== Модуль 2: три реплики redirect-service (HTTP-редирект + gRPC + WebSocket) =====
  redirect-service-1:
    <<: *redirect-service
    hostname: redirect-service-1
  redirect-service-2:
    <<: *redirect-service
    hostname: redirect-service-2
  redirect-service-3:
    <<: *redirect-service
    hostname: redirect-service-3

  # ===== Балансировщик =====
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"         # HTTP + WebSocket
      - "50051:50051"   # gRPC
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - link-service-1
      - link-service-2
      - link-service-3
      - redirect-service-1
      - redirect-service-2
      - redirect-service-3
    restart: unless-stopped

volumes:
  pgdata:
