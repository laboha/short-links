<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сокращатель ссылок</title>
  <style>
    :root {
      --bg: #f4f1ea; --card: #fffdf8; --ink: #1d1b16; --muted: #6b665a;
      --line: #ddd6c6; --accent: #d9481e; --accent-ink: #fff; --ok: #2f7a4b;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #16150f; --card: #1f1d16; --ink: #f0ebdd; --muted: #a39c8b;
              --line: #37332a; --accent: #ff6a3d; --accent-ink: #16150f; --ok: #6fc28f; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink);
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 48px 16px; }
    h1 { font-size: 40px; line-height: 1.1; margin: 0 0 8px; letter-spacing: -0.02em; }
    h1 span { color: var(--accent); }
    .sub { color: var(--muted); margin: 0 0 32px; }
    form { display: flex; gap: 8px; flex-wrap: wrap; }
    input { flex: 1 1 320px; padding: 14px 16px; font: inherit; color: var(--ink);
            background: var(--card); border: 2px solid var(--line); border-radius: 10px; }
    input:focus { outline: none; border-color: var(--accent); }
    button { padding: 14px 22px; font: inherit; font-weight: 600; cursor: pointer;
             background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; }
    button:disabled { opacity: .6; cursor: wait; }
    .result { margin-top: 20px; padding: 16px; border-radius: 10px; background: var(--card);
              border: 1px solid var(--line); display: none; }
    .result.show { display: block; }
    .result.error { border-color: var(--accent); color: var(--accent); }
    .short { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .short a { font-size: 22px; font-weight: 700; color: var(--ok); word-break: break-all; }
    .ghost { background: transparent; color: var(--ink); border: 1px solid var(--line);
             padding: 6px 12px; font-weight: 500; }
    .meta { color: var(--muted); font-size: 13px; margin-top: 6px; }
    .meta a, td a { color: inherit; }
    h2 { font-size: 18px; margin: 40px 0 12px; display: flex; justify-content: space-between; }
    table { width: 100%; border-collapse: collapse; background: var(--card);
            border: 1px solid var(--line); border-radius: 10px; overflow: hidden; font-size: 14px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 500; }
    td.url { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    td code { font-weight: 700; }
    .del { background: transparent; color: var(--accent); padding: 4px 8px; font-weight: 500; }
    .empty { color: var(--muted); text-align: center; padding: 24px; }
  </style>
</head>
<body>
<main>
  <h1>Сокра<span>ти</span> ссылку</h1>
  <p class="sub">Вставь длинный адрес — получишь короткий.</p>

  <form id="form">
    <input id="url" type="text" placeholder="https://example.com/очень/длинная/ссылка" required>
    <button id="btn" type="submit">Сократить</button>
  </form>

  <div id="result" class="result"></div>

  <h2>Все ссылки <span class="meta"><a href="/stats/">статистика</a> · <span id="servedBy"></span></span></h2>
  <table>
    <thead><tr><th>Код</th><th>Оригинал</th><th>Создана</th><th></th></tr></thead>
    <tbody id="list"><tr><td colspan="4" class="empty">Загрузка…</td></tr></tbody>
  </table>
</main>

<script>
  const form = document.getElementById('form');
  const input = document.getElementById('url');
  const btn = document.getElementById('btn');
  const result = document.getElementById('result');
  const list = document.getElementById('list');

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // FastAPI возвращает ошибки валидации списком — достаём понятный текст
  function errorText(data) {
    if (Array.isArray(data.detail)) return data.detail.map(d => d.msg.replace(/^Value error, /, '')).join('; ');
    return data.detail || 'Неизвестная ошибка';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true;
    try {
      const res = await fetch('/api/links', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({url: input.value})
      });
      const data = await res.json();
      if (!res.ok) throw new Error(errorText(data));

      result.className = 'result show';
      result.innerHTML = `
        <div class="short">
          <a href="${escapeHtml(data.short_url)}" target="_blank">${escapeHtml(data.short_url)}</a>
          <button class="ghost" id="copy" type="button">Копировать</button>
        </div>
        <div class="meta">Ответила реплика: ${escapeHtml(data.served_by)} ·
          <a href="/stats/?code=${encodeURIComponent(data.short_code)}">статистика переходов →</a></div>`;
      document.getElementById('copy').onclick = () => navigator.clipboard.writeText(data.short_url);
      input.value = '';
      loadLinks();
    } catch (err) {
      result.className = 'result show error';
      result.textContent = err.message;
    } finally {
      btn.disabled = false;
    }
  });

  async function loadLinks() {
    const res = await fetch('/api/links');
    const data = await res.json();
    document.getElementById('servedBy').textContent = 'реплика: ' + data.served_by;
    if (!data.links.length) {
      list.innerHTML = '<tr><td colspan="4" class="empty">Пока нет ссылок</td></tr>';
      return;
    }
    list.innerHTML = data.links.map(l => `
      <tr>
        <td><a href="/stats/?code=${encodeURIComponent(l.short_code)}" title="Статистика"><code>${escapeHtml(l.short_code)}</code></a></td>
        <td class="url" title="${escapeHtml(l.original_url)}">${escapeHtml(l.original_url)}</td>
        <td>${new Date(l.created_at).toLocaleString('ru-RU')}</td>
        <td><button class="del" data-code="${escapeHtml(l.short_code)}">Удалить</button></td>
      </tr>`).join('');
  }

  list.addEventListener('click', async (e) => {
    const code = e.target.dataset.code;
    if (!code) return;
    await fetch('/api/links/' + encodeURIComponent(code), {method: 'DELETE'});
    loadLinks();
  });

  loadLinks();
</script>
</body>
</html>
