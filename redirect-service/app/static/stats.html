<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>short — статистика</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Общий стиль — такой же на главной странице */
    :root {
      --bg: #ffffff; --soft: #f5f5f7; --line: #e8e8ed;
      --ink: #1d1d1f; --muted: #6e6e73; --accent: #0071e3; --accent-hover: #0077ed;
      --ok: #1d8a43; --danger: #d70015;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #000; --soft: #1c1c1e; --line: #2c2c2e;
              --ink: #f5f5f7; --muted: #8e8e93; --accent: #2997ff; --accent-hover: #47a6ff;
              --ok: #30d158; --danger: #ff453a; }
    }
    * { box-sizing: border-box; margin: 0; }
    body { background: var(--bg); color: var(--ink);
           font: 17px/1.47 Inter, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
           -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }

    header { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 80%, transparent);
             backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
             border-bottom: 1px solid var(--line); }
    .bar { max-width: 980px; margin: 0 auto; padding: 0 16px; height: 52px;
           display: flex; align-items: center; justify-content: center; }
    .tabs { display: flex; background: var(--soft); border-radius: 999px; padding: 3px; }
    .tabs a { padding: 6px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--muted); }
    .tabs a.active { background: var(--bg); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

    main { max-width: 680px; margin: 0 auto; padding: 0 16px 80px; }
    .hero { text-align: center; padding: 72px 0 40px; }
    h1 { font-size: clamp(36px, 7vw, 56px); line-height: 1.07; font-weight: 700; letter-spacing: -0.035em; }
    .lead { margin-top: 12px; font-size: 19px; color: var(--muted); }

    .live { display: inline-flex; align-items: center; gap: 8px; margin-top: 16px; font-size: 14px; color: var(--muted); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .live.on .dot { background: var(--ok); animation: pulse 2s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 50%, transparent); }
                       70% { box-shadow: 0 0 0 8px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

    /* Список всех ссылок */
    .list { border-top: 1px solid var(--line); }
    .item { display: flex; align-items: center; gap: 16px; padding: 18px 4px; border-bottom: 1px solid var(--line); }
    .item:hover .code { color: var(--accent); }
    .rank { width: 24px; color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
    .info { flex: 1; min-width: 0; }
    .code { font-weight: 600; transition: color .2s; }
    .url { font-size: 14px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .clicks { text-align: right; font-size: 13px; color: var(--muted); white-space: nowrap; }
    .clicks b { display: block; font-size: 20px; font-weight: 600; color: var(--ink); line-height: 1.2; }
    .chev { color: var(--muted); font-size: 22px; }
    .empty { padding: 48px 0; text-align: center; color: var(--muted); }
    .empty a { color: var(--accent); }

    /* Одна ссылка */
    .back { display: inline-block; margin-top: 28px; font-size: 15px; color: var(--accent); }
    .detail { text-align: center; padding-top: 32px; }
    .detail .short { font-size: clamp(22px, 5vw, 32px); font-weight: 700; letter-spacing: -0.02em; word-break: break-all; }
    .detail .short:hover { color: var(--accent); }
    .detail .orig { margin-top: 4px; font-size: 15px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .big { margin-top: 48px; font-size: clamp(96px, 22vw, 168px); line-height: 1; font-weight: 700;
           letter-spacing: -0.05em; font-variant-numeric: tabular-nums; transition: transform .25s, color .25s; }
    .big.bump { transform: scale(1.06); color: var(--accent); }
    .big-label { font-size: 21px; color: var(--muted); }

    .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 48px; }
    .fact { background: var(--soft); border-radius: 20px; padding: 20px; text-align: left; }
    .fact .k { font-size: 13px; color: var(--muted); }
    .fact .v { margin-top: 2px; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }

    .chart { background: var(--soft); border-radius: 20px; padding: 24px 20px 16px; margin-top: 12px; }
    .chart .k { font-size: 13px; color: var(--muted); }
    .bars { display: flex; align-items: flex-end; gap: 10px; height: 160px; margin-top: 16px; }
    .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; }
    .col .n { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .col .track { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
    .col .b { width: 100%; max-width: 40px; min-height: 4px; border-radius: 8px; background: var(--line); transition: height .4s ease; }
    .col.has .b { background: var(--accent); }
    .col.has .n { color: var(--ink); font-weight: 600; }
    .col .d { font-size: 12px; color: var(--muted); }

    .actions { display: flex; gap: 10px; justify-content: center; margin-top: 32px; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; height: 44px; padding: 0 22px; border-radius: 999px;
           font-size: 15px; font-weight: 600; background: var(--accent); color: #fff; transition: background .2s, transform .1s; }
    .btn:hover { background: var(--accent-hover); }
    .btn:active { transform: scale(.97); }
    .btn.ghost { background: var(--soft); color: var(--ink); }
    .btn.ghost:hover { background: var(--line); }

    footer { margin-top: 48px; text-align: center; font-size: 12px; color: var(--muted); }
    [hidden] { display: none !important; }

    @media (max-width: 520px) {
      .hero { padding-top: 48px; }
      .tabs a { padding: 6px 12px; }
      .rank { display: none; }
    }
  </style>
</head>
<body>
<header>
  <div class="bar">
    <nav class="tabs">
      <a href="/">Сократить</a>
      <a href="/stats/" class="active">Статистика</a>
    </nav>
  </div>
</header>

<main>
  <!-- Экран 1: все ссылки -->
  <section id="overview" hidden>
    <div class="hero">
      <h1>Статистика</h1>
      <p class="lead">Какие ссылки открывают чаще всего.</p>
      <div class="live" id="liveAll"><span class="dot"></span><span>Обновляется в реальном времени</span></div>
    </div>
    <div class="list" id="list"><p class="empty">Загрузка…</p></div>
  </section>

  <!-- Экран 2: одна ссылка -->
  <section id="detail" hidden>
    <a class="back" href="/stats/">‹ Все ссылки</a>
    <div class="detail">
      <a class="short" id="short" target="_blank" title="Открыть ссылку"></a>
      <p class="orig" id="orig"></p>

      <div class="big" id="total">0</div>
      <p class="big-label" id="totalLabel">переходов</p>
      <div class="live" id="liveOne"><span class="dot"></span><span id="liveText">Подключение…</span></div>

      <div class="facts">
        <div class="fact"><div class="k">Сегодня</div><div class="v" id="today">0</div></div>
        <div class="fact"><div class="k">Последний переход</div><div class="v" id="last">—</div></div>
      </div>

      <div class="chart">
        <div class="k">Последние 7 дней</div>
        <div class="bars" id="bars"></div>
      </div>

      <div class="actions">
        <button class="btn" id="copy" type="button">Копировать ссылку</button>
        <a class="btn ghost" href="/">Сократить новую</a>
      </div>
    </div>
  </section>

  <!-- Экран 3: ссылка не найдена -->
  <section id="missing" class="hero" hidden>
    <h1>Ссылка не найдена</h1>
    <p class="lead">Возможно, её удалили.</p>
    <div class="actions"><a class="btn" href="/stats/">Все ссылки</a></div>
  </section>

  <footer id="server"></footer>
</main>

<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const plural = n => n % 10 === 1 && n % 100 !== 11 ? 'переход'
    : [2,3,4].includes(n % 10) && ![12,13,14].includes(n % 100) ? 'перехода' : 'переходов';
  const wsUrl = key => (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/' + key;
  const code = new URLSearchParams(location.search).get('code');

  function ago(iso) {
    if (!iso) return '—';
    const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
    if (s < 60) return 'только что';
    if (s < 3600) return Math.floor(s / 60) + ' мин назад';
    if (s < 86400) return Math.floor(s / 3600) + ' ч назад';
    return new Date(iso).toLocaleDateString('ru-RU', {day: 'numeric', month: 'long'});
  }

  // Подписка на WebSocket с автоматическим переподключением
  function subscribe(key, onMessage, onState) {
    let ws;
    (function connect() {
      ws = new WebSocket(wsUrl(key));
      ws.onopen = () => onState(true);
      ws.onmessage = e => onMessage(JSON.parse(e.data));
      ws.onclose = () => { onState(false); setTimeout(connect, 2000); };
    })();
    setInterval(() => ws.readyState === 1 && ws.send('ping'), 25000);
  }

  /* ---------- Экран: все ссылки ---------- */
  async function loadList() {
    const r = await fetch('/stats/api/top?n=100');
    const t = await r.json();
    $('server').textContent = `Сервер ${t.http_replica} · gRPC ${t.grpc_replica}`;
    if (!t.links.length) {
      $('list').innerHTML = '<p class="empty">Ссылок пока нет. <a href="/">Создайте первую →</a></p>';
      return;
    }
    $('list').innerHTML = t.links.map((l, i) => `
      <a class="item" href="/stats/?code=${encodeURIComponent(l.code)}">
        <span class="rank">${i + 1}</span>
        <div class="info">
          <div class="code">${esc(location.host + '/' + l.code)}</div>
          <div class="url">${esc(l.original_url)}</div>
        </div>
        <div class="clicks"><b>${l.clicks}</b>${plural(l.clicks)}</div>
        <span class="chev">›</span>
      </a>`).join('');
  }

  /* ---------- Экран: одна ссылка ---------- */
  let lastClick = null;

  async function loadOne() {
    const r = await fetch('/stats/api/' + encodeURIComponent(code));
    if (!r.ok) { $('missing').hidden = false; return false; }
    const s = await r.json();

    const url = location.origin + '/' + s.code;
    $('short').textContent = location.host + '/' + s.code;
    $('short').href = '/' + s.code;
    $('orig').textContent = s.original_url;
    $('copy').onclick = async () => {
      try { await navigator.clipboard.writeText(url); } catch { return; }
      $('copy').textContent = 'Скопировано ✓';
      setTimeout(() => $('copy').textContent = 'Копировать ссылку', 1500);
    };

    setTotal(s.total_clicks, false);
    lastClick = s.last_click;
    $('last').textContent = ago(lastClick);
    drawChart(s.by_day);
    $('server').textContent = `Сервер ${s.http_replica} · gRPC ${s.grpc_replica}`;
    $('detail').hidden = false;
    return true;
  }

  function setTotal(n, animate = true) {
    $('total').textContent = n;
    $('totalLabel').textContent = plural(n);
    if (animate) {
      $('total').classList.add('bump');
      setTimeout(() => $('total').classList.remove('bump'), 250);
    }
  }

  // Столбики за последние 7 дней (дни без переходов — пустые)
  function drawChart(byDay) {
    const map = Object.fromEntries(byDay.map(d => [d.day, d.clicks]));
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(); d.setUTCDate(d.getUTCDate() - i);
      days.push(d.toISOString().slice(0, 10));
    }
    const vals = days.map(d => map[d] || 0);
    const max = Math.max(1, ...vals);
    $('today').textContent = vals[6];
    $('bars').innerHTML = days.map((d, i) => {
      const label = i === 6 ? 'сегодня' : new Date(d + 'T12:00:00Z').toLocaleDateString('ru-RU', {weekday: 'short'});
      return `<div class="col ${vals[i] ? 'has' : ''}">
        <span class="n">${vals[i] || ''}</span>
        <div class="track"><div class="b" style="height:${vals[i] / max * 100}%"></div></div>
        <span class="d">${label}</span>
      </div>`;
    }).join('');
  }

  /* ---------- Запуск ---------- */
  if (code) {
    loadOne().then(ok => {
      if (!ok) return;
      subscribe(code, m => {
        if (m.type === 'init') {
          $('liveText').textContent = 'Обновляется в реальном времени';
          return;
        }
        setTotal(m.total);
        lastClick = m.last_click;
        $('last').textContent = ago(lastClick);
        loadOne();  // обновить график
      }, on => {
        $('liveOne').classList.toggle('on', on);
        if (!on) $('liveText').textContent = 'Переподключение…';
      });
      setInterval(() => $('last').textContent = ago(lastClick), 30000);
    });
  } else {
    $('overview').hidden = false;
    loadList();
    subscribe('all', () => loadList(), on => $('liveAll').classList.toggle('on', on));
  }
</script>
</body>
</html>
