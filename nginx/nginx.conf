events {}

http {
    # В логе видно, на какую реплику ушёл запрос ($upstream_addr)
    log_format upstreamlog '$remote_addr [$time_local] "$request" $status '
                           '-> $upstream_addr ($upstream_response_time s)';
    access_log /dev/stdout upstreamlog;

    # Для WebSocket: Connection: upgrade, если клиент прислал заголовок Upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ===== Модуль 1: link-service, три реплики =====
    # По умолчанию nginx раздаёт запросы по кругу (round-robin):
    # 1-й запрос -> link-service-1, 2-й -> link-service-2, 3-й -> link-service-3, ...
    upstream link_service {
        server link-service-1:8000;
        server link-service-2:8000;
        server link-service-3:8000;
    }

    # ===== Модуль 2: redirect-service, три реплики =====
    # Редиректы и /stats/ — обычный round-robin
    upstream redirect_service {
        server redirect-service-1:8000;
        server redirect-service-2:8000;
        server redirect-service-3:8000;
    }

    # WebSocket — ip_hash: клиент с одного IP всегда попадает на одну реплику,
    # долгое соединение не «прыгает» между контейнерами
    upstream redirect_ws {
        ip_hash;
        server redirect-service-1:8000;
        server redirect-service-2:8000;
        server redirect-service-3:8000;
    }

    # gRPC статистики — round-robin поверх HTTP/2
    upstream redirect_grpc {
        server redirect-service-1:50051;
        server redirect-service-2:50051;
        server redirect-service-3:50051;
    }

    server {
        listen 80;

        # Общие заголовки: сервис видит реальный IP клиента, а не IP nginx
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # REST API модуля 1
        location /api/ {
            proxy_pass http://link_service;
        }

        # Главная страница с формой (только ровно "/")
        location = / {
            proxy_pass http://link_service;
        }

        # WebSocket модуля 2 (живой счётчик переходов)
        location /ws/ {
            proxy_pass http://redirect_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        # Страница статистики и REST-шлюз к gRPC (модуль 2)
        location /stats/ {
            proxy_pass http://redirect_service;
        }

        # Всё остальное (/aB3xK9 и т.п.) — короткие ссылки, модуль 2
        location / {
            proxy_pass http://redirect_service;
        }
    }

    # gRPC-балансировщик статистики (порт 50051)
    server {
        listen 50051 http2;   # gRPC работает только поверх HTTP/2

        location / {
            grpc_pass grpc://redirect_grpc;
        }
    }
}
