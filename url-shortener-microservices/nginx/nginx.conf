events {}

http {
    # ===== Модуль 1: link-service, три реплики =====
    # По умолчанию nginx раздаёт запросы по кругу (round-robin):
    # 1-й запрос -> link-service-1, 2-й -> link-service-2, 3-й -> link-service-3, ...
    upstream link_service {
        server link-service-1:8000;
        server link-service-2:8000;
        server link-service-3:8000;
    }

    # ===== Модуль 2: redirect-service (добавит второй человек) =====
    # upstream redirect_service {
    #     server redirect-service-1:8001;
    #     server redirect-service-2:8001;
    # }

    server {
        listen 80;

        # Общие заголовки: сервис видит реальный IP клиента, а не IP nginx
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # REST API модуля 1
        location /api/ {
            proxy_pass http://link_service;
        }

        # Главная страница с формой (только ровно "/")
        location = / {
            proxy_pass http://link_service;
        }

        # Всё остальное (/aB3xK9 и т.п.) — короткие ссылки, это модуль 2.
        # Пока модуля 2 нет, отвечаем 404.
        location / {
            # proxy_pass http://redirect_service;
            return 404 "redirect-service ещё не подключён\n";
        }
    }
}
